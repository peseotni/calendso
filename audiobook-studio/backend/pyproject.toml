[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-studio"
version = "1.0.0"
description = "Self-hosted audiobook creation suite: turn ebooks and PDFs into chaptered audiobooks and organize your library."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pymupdf>=1.24",
  "lxml>=5",
  "python-docx>=1.1",
  "mobi>=0.3.3",
  "charset-normalizer>=3",
  "mutagen>=1.47",
  "numpy>=1.26",
  "soxr>=0.3",
  "soundfile>=0.12",
  "httpx>=0.27",
  "pillow>=10",
  "kokoro-onnx>=0.6,<0.7",
  "piper-tts>=1.3,<2",
  "edge-tts>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.16"]

[project.scripts]
audiobook-studio = "audiobook_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["audiobook_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
